# Decodes the kit binaries from their base64 text snapshots in kit-b64/.
# The GitHub connector cannot transfer binary files, so binaries live in the
# repo as .b64 text; this workflow materializes the real files on push.
# It only runs when kit-b64/ or this workflow changes, so it never loops.
name: Decode kit binaries
on:
  push:
    branches: [main]
    paths:
      - 'kit-b64/**'
      - '.github/workflows/decode-kit.yml'
      - 'scripts/decode_kit_binaries.py'
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode binaries
        run: python3 scripts/decode_kit_binaries.py
      - name: Check preserved tools and fingerprints
        run: python3 scripts/reconcile_tool_downloads.py --check
      - name: Commit decoded binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kit docs/kit assets/img docs/assets/img
          git diff --cached --quiet || git commit -m "decode kit binaries from kit-b64 snapshots"
          git push
