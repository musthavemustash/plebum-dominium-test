# Fresh publication from current main; approved homepage source unchanged.
name: Publish offline tester downloads
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - review/fixtures/**
      - scripts/prepare_public_test_release.py
      - scripts/publish_offline_downloads.py
      - scripts/check_offline_downloads.py
      - scripts/build_download_verifier.py
      - scripts/test_download_verifier.cjs
      - scripts/test_public_session_state.cjs
      - scripts/test_tool_network.cjs
      - scripts/test_diceware_mapper.cjs
      - scripts/build_tool_fingerprints.py
      - scripts/test_fingerprint_checker.cjs
      - templates/download-verifier.html
      - scripts/reviewed_route_overrides.json
      - scripts/render_paths.py
      - scripts/page_test_modules.py
      - scripts/page_test_catalog.json
      - scripts/test_page_test_modules.py
      - .github/workflows/offline-downloads.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: offline-tester-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate public test downloads
        run: |
          python3 scripts/prepare_public_test_release.py /tmp/plebum-current-alpha --source-commit "$(git rev-parse HEAD)"
          mkdir -p docs/testing/alpha-20261108-t5-r4
          cp /tmp/plebum-current-alpha/* docs/testing/alpha-20261108-t5-r4/
          python3 scripts/page_test_modules.py --build "$(git rev-parse HEAD)"
          python3 scripts/publish_offline_downloads.py
          node scripts/test_download_verifier.cjs
          node scripts/test_public_session_state.cjs
          node scripts/test_tool_network.cjs
          node scripts/test_diceware_mapper.cjs
          node scripts/test_fingerprint_checker.cjs
          python3 scripts/test_tool_core.py
          python3 scripts/build.py
          python3 scripts/test_paths.py
          python3 scripts/test_page_test_modules.py
          python3 scripts/check_offline_downloads.py
      - name: Preserve published source and packages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Publish complete offline tester and website tools downloads'
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
